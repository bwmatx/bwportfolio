<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alima Photo - Form Booking</title>
    <link rel="icon" href="https://ik.imagekit.io/bwindonesiaimg/alima/logo.png?updatedAt=1776383252051" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: brightness(0) invert(1);
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #333;
            line-height: 1;
            margin-bottom: 0.25rem;
            letter-spacing: -0.04em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 0.875rem;
            font-weight: 400;
            color: #999;
            margin-bottom: 2rem;
        }

        .goto-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #fff;
            color: #111;
            font-family: 'Poppins', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.875rem 2rem;
            border-radius: 9999px;
            text-decoration: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .goto-btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        .goto-btn:active {
            transform: translateY(0);
        }

        .goto-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://ik.imagekit.io/bwindonesiaimg/alima/logo.png?updatedAt=1776383252051" alt="Alima Photo Logo" class="logo">
        <p class="error-code">410</p>
        <h1>Page not found</h1>
        <p>This page has been taken down by the owner.</p>
        <a href="https://alima.adhiwibowo.space/formbooking.html" class="goto-btn">
            Goto Alima Website
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"/></svg>
        </a>
    </div>
</body>
</html>
